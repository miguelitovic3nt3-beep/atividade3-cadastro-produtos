<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produtos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Cadastro de Produtos</h1>
        <p>Gerencie seus produtos de forma simples</p>
    </header>

    <main>
        <section class="formulario">
            <h2>Novo Produto</h2>
            <form id="formProduto">
                <label for="nome">Nome do produto</label>
                <input type="text" id="nome" required minlength="2">

                <label for="preco">Preço (R$)</label>
                <input type="number" id="preco" min="0.01" step="0.01" required>

                <label for="quantidade">Quantidade</label>
                <input type="number" id="quantidade" min="0" step="1" required>

                <button type="submit" id="botaoCadastrar">Cadastrar Produto</button>
            </form>
            <p id="mensagem" role="status"></p>
        </section>

        <section class="lista">
            <h2>Produtos Cadastrados</h2>
            <p id="total">Carregando produtos...</p>
            <div id="listaProdutos"></div>
        </section>
    </main>

    <footer>
        <p>Projeto de DWS - 4º Bimestre</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
